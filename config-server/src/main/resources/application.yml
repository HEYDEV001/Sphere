spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/HEYDEV001/Sphere-Config-server
          username: ${GIT_USERNAME}
          password: ${GIT_TOKEN}
          default-label: master

server:
  port: 8888
eureka:
  client:
    service-url:
      default-zone: http://discovery-server:8761/eureka/




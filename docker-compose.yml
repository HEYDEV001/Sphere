
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - "kafka-data:/var/lib/kafka/data"
    networks:
      - sphere-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3


  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KSQLDBSERVERS: http://ksqldb0:8088
    networks:
      - sphere-network



  sendgrid:
    image: ykanazawa/sendgrid-maildev
    hostname: sendgrid-maildev
    environment:
      - SENDGRID_DEV_API_SERVER=:3030
      - SENDGRID_DEV_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_DEV_SMTP_SERVER=0.0.0.0:1025
    container_name: sendgrid
    ports:
      - 1025:1025
      - 1080:1080
      - 3030:3030
    networks:
      - sphere-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - 9411:9411
    environment:
      - STORAGE_TYPE=mem
    networks:
      - sphere-network


  config-server:
    container_name: config-server
    image: heydev001/sphere-config-server:latest
    environment:
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_TOKEN: ${GIT_TOKEN}
    ports:
      - 8888:8888
    networks:
      - sphere-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s



  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped
    networks:
      - sphere-network


  notification-db:
    image: postgres:16
    container_name: notification-db
    environment:
      - POSTGRES_DB=Sphere-notificationDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - sphere-network


  post-db:
    image: postgres:16
    container_name: post-db
    environment:
      - POSTGRES_DB=Sphere-postDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - post-db-data:/var/lib/postgresql/data
    networks:
      - sphere-network



  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      - POSTGRES_DB=Sphere-userDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - sphere-network



  connection-db:
    image: neo4j
    container_name: connection-db
    environment:
      - NEO4J_AUTH=neo4j/${DB_PASS}
      - NEO4J_server_memory_heap_initial__size=128m
      - NEO4J_server_memory_heap_max__size=256m
      - NEO4J_server_memory_pagecache_size=128m
    ports:
      - "7474:7474"  # Http ports
      - "7687:7687"  # Bolt ports
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - connection-db-data:/data
    networks:
      - sphere-network




  discovery-server:
    image: heydev001/sphere-discovery-server:latest
    container_name: discovery-server
    networks:
      - sphere-network
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s



  notification-service:
    image: heydev001/sphere-notification-service:latest
    container_name: notification-service
    networks:
      - sphere-network
    environment:
      DB_PASS: ${DB_PASS}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      zipkin:
        condition: service_started
      sendgrid:
        condition: service_started



  connection-service:
    image: heydev001/sphere-connection-service:latest
    container_name: connection-service
    networks:
      - sphere-network
    environment:
      DB_PASS: ${DB_PASS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      connection-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      zipkin:
        condition: service_started



  post-service:
    image: heydev001/sphere-post-service:latest
    container_name: post-service
    networks:
      - sphere-network
    environment:
      DB_PASS: ${DB_PASS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      post-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      zipkin:
        condition: service_started




  user-service:
    image: heydev001/sphere-user-service:latest
    container_name: user-service
    networks:
      - sphere-network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_PASS: ${DB_PASS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      discovery-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      zipkin:
        condition: service_started
      kafka:
        condition: service_healthy



  api-gateway:
    image: heydev001/sphere-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - sphere-network
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      zipkin:
        condition: service_started

networks:
  sphere-network:


volumes:
  kafka-data:
  notification-db-data:
  post-db-data:
  user-db-data:
  connection-db-data:
  redis-data: